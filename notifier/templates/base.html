<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inbox{% endblock %} · Agent Notifier</title>
  <link id="favicon" rel="icon" type="image/svg+xml"
        href="{{ url_for('static', filename='favicon-unread.svg' if unread_total else 'favicon.svg') }}"
        data-read="{{ url_for('static', filename='favicon.svg') }}"
        data-unread="{{ url_for('static', filename='favicon-unread.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body data-page="{% block page %}{% endblock %}" data-version="{{ state.version }}">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('inbox') }}">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
        Agent Notifier
      </a>
      <a class="inbox-link" href="{{ url_for('inbox') }}">
        Inbox <span id="header-count" class="count"{% if not unread_total %} hidden{% endif %}>{{ unread_total }}</span>
      </a>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='live.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
